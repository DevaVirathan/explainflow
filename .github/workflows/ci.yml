# =============================================================================
# ExplainFlow — Continuous Integration
# =============================================================================
# Runs on every push and pull request to main.
# Matrix: Python 3.9 · 3.10 · 3.11 · 3.12 × ubuntu-latest
# Jobs: lint → test (with coverage) → build verification
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type-check (fast-fail gate)
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint & Type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Black (format check)
        run: black --check src/ tests/

      - name: Mypy (type-check)
        run: mypy src/explainflow/

  # ---------------------------------------------------------------------------
  # Test matrix
  # ---------------------------------------------------------------------------
  test:
    name: "Test · Python ${{ matrix.python-version }}"
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=explainflow \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=20

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build verification (ensures the package builds cleanly)
  # ---------------------------------------------------------------------------
  build-check:
    name: "Build verification"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Verify package metadata
        run: |
          pip install dist/*.whl
          python -c "import explainflow; print(f'✓ explainflow {explainflow.__version__} installed successfully')"
